<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mini Chunkbase - Minecraft Education</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>

    <h1>Mini Chunkbase – Minecraft Education</h1>

    <div id="controls">
        <input type="number" id="seedInput" placeholder="Entre un seed">
        <button onclick="generateMap()">Générer</button>

        <div id="layers">
            <label><input type="checkbox" id="villages" checked> Villages</label>
            <label><input type="checkbox" id="temples" checked> Temples</label>
            <label><input type="checkbox" id="biomes" checked> Biomes</label>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>

</body>
</html>
